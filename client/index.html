<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bomberman Multiplayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #app { position: relative; }
    #game-mount canvas { display: block; }
    #name-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(15, 15, 30, 0.92);
      z-index: 2000;
    }
    #name-overlay .card {
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 10px;
      padding: 24px 28px;
      min-width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    #name-overlay label {
      display: block;
      color: #e0e0e0;
      font-size: 14px;
      margin-bottom: 8px;
    }
    #name-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #30475e;
      border-radius: 6px;
      background: #1a1a2e;
      color: #fff;
      margin-bottom: 16px;
    }
    #name-submit {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: #fff;
      cursor: pointer;
    }
    #name-submit:hover { background: #2980b9; }
    #results-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 22, 0.88);
      z-index: 2100;
    }
    #results-overlay .card.wide {
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 12px;
      padding: 22px 26px;
      min-width: 320px;
      max-width: min(420px, 92vw);
      max-height: 85vh;
      overflow: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    #results-overlay h2 {
      color: #e0e0e0;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }
    #results-reason {
      color: #a8d8ff;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    #results-list {
      list-style: none;
      margin: 0 0 18px 0;
      padding: 0;
    }
    #results-list li {
      color: #eee;
      padding: 8px 10px;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    #results-list li.results-you {
      outline: 2px solid #3498db;
      background: rgba(52, 152, 219, 0.15);
    }
    #results-countdown {
      color: #ffd54f;
      font-size: 0.9rem;
      margin-bottom: 12px;
      text-align: center;
    }
    #results-close {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: #0d1f14;
      cursor: pointer;
    }
    #results-close:hover { filter: brightness(1.08); }
    #controls-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 22, 0.9);
      z-index: 2050;
    }
    #controls-overlay .card {
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 10px;
      padding: 24px 28px;
      min-width: 300px;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #controls-overlay h3 {
      color: #a8d8ff;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    #controls-overlay table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
    }
    #controls-overlay td {
      color: #e0e0e0;
      font-size: 13px;
      padding: 6px 4px;
      vertical-align: middle;
    }
    #controls-overlay td:first-child {
      color: #888;
      width: 38%;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #controls-overlay kbd {
      display: inline-block;
      background: #0d1b2a;
      border: 1px solid #30475e;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
      font-size: 12px;
      color: #a8d8ff;
      margin: 0 2px;
    }
    #controls-overlay p.hint {
      color: #888;
      font-size: 11px;
      margin-bottom: 14px;
      text-align: center;
    }
    #controls-close {
      width: 100%;
      padding: 9px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: #fff;
      cursor: pointer;
    }
    #controls-close:hover { background: #2980b9; }
    
    #lobby-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 22, 0.88);
      z-index: 2200;
    }
    #lobby-overlay .card.wide {
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 12px;
      padding: 22px 26px;
      min-width: 380px;
      max-width: min(480px, 92vw);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #lobby-overlay h2 {
      color: #e0e0e0;
      text-align: center;
      font-size: 1.5rem;
    }
    .lobby-players {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .lobby-players h3 {
      font-size: 13px;
      color: #a8d8ff;
      margin-bottom: 8px;
    }
    #lobby-player-list {
      list-style: none;
    }
    #lobby-player-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #eee;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }
    .lobby-color-preview {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .lobby-color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px 0;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-btn:hover {
      transform: scale(1.1);
    }
    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
    .color-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }
    #lobby-start-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #2ecc71;
      color: #0d1f14;
      cursor: pointer;
      display: none; /* Only host */
    }
    #lobby-start-btn:hover { filter: brightness(1.1); }
    #lobby-waiting-text {
      text-align: center;
      color: #ffd54f;
      font-size: 14px;
      font-style: italic;
    }
    #lobby-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #lobby-vol-btn {
      padding: 6px 12px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #30475e;
      border-radius: 4px;
      background: #0d1b2a;
      color: #66dd88;
      cursor: pointer;
    }
    #lobby-vol-btn:hover { background: #1a304e; }
  </style>
</head>
<body>
  <div id="app">
    <div id="game-mount"></div>
    <div id="name-overlay">
      <div class="card">
        <label for="name-input">Nombre (opcional)</label>
        <input id="name-input" type="text" maxlength="24" placeholder="Tu nombre" autocomplete="username" />
        <button type="button" id="name-submit">Jugar</button>
      </div>
    </div>
    <div id="controls-overlay">
      <div class="card">
        <h3>Controles</h3>
        <table>
          <tr>
            <td>Mover</td>
            <td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></td>
          </tr>
          <tr>
            <td>Bomba</td>
            <td><kbd>Espacio</kbd></td>
          </tr>
          <tr>
            <td>Burla</td>
            <td><kbd>E</kbd> — cicla entre 3 mensajes, se envía tras 500ms</td>
          </tr>
          <tr>
            <td>Volumen</td>
            <td>Click en <kbd>VOL</kbd> en el panel lateral</td>
          </tr>
        </table>
        <p class="hint">Presiona cualquier tecla para cerrar</p>
        <button type="button" id="controls-close">¡Entendido!</button>
      </div>
    </div>
    <div id="results-overlay">
      <div class="card wide">
        <h2>Partida terminada</h2>
        <p id="results-reason"></p>
        <ul id="results-list"></ul>
        <p id="results-countdown"></p>
        <button type="button" id="results-close">Cerrar</button>
      </div>
    </div>
    <div id="lobby-overlay">
      <div class="card wide">
        <div id="lobby-top-bar">
          <h2>Lobby</h2>
          <button type="button" id="lobby-vol-btn">♪ VOL: NORMAL</button>
        </div>
        <div class="lobby-players">
          <h3>Jugadores Unidos</h3>
          <ul id="lobby-player-list"></ul>
        </div>
        <div>
          <h3 style="color:#a8d8ff; font-size:13px; text-align:center;">Elige tu Color</h3>
          <div class="lobby-color-picker" id="lobby-color-picker">
            <!-- Botones generados dinámicamente -->
          </div>
        </div>
        <button type="button" id="lobby-start-btn">INICIAR PARTIDA</button>
        <p id="lobby-waiting-text">Esperando al Host...</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
